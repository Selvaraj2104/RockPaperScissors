<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>RPS Game</title>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="rps">
                <button id="rock" onclick="play('rock')">Rock</button>
                <button id="paper" onclick="play('paper')">Paper</button>
                <button id="scissor" onclick="play('scissor')">Scissor</button>
            </div>

            <div id="rounds">Round: <span id="round">0</span> / 5</div>
            <div id="result"></div>
            <div id="score">User: <span id="userScore">0</span> | Computer: <span id="computerScore">0</span></div>
            <div id="finalResult"></div>

            <button id="resetBtn" onclick="resetGame()">Reset Game</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
